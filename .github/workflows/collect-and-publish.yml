name: Collect free sources and publish dashboard

on:
  schedule:
    - cron: '17 23 * * *' # 08:17 Japan time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lockscreen-monitor
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      # Workflow re-runs may check out an outdated commit. Always collect from current main.
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect free sources
        run: python collector.py
      - name: Save observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitor.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public-source observations'
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p site/data
          cp app/index.html app/app.js app/style.css site/
          cp data/monitor.json site/data/monitor.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
