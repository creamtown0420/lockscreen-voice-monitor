name: Install dashboard source
on:
  push:
    paths:
      - '.bootstrap/ready'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and commit application
        run: |
          test -f .bootstrap/ready
          cat .bootstrap/part-*.txt | base64 -d | tar -xz
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: install dashboard, collectors and daily Pages deployment'
            git push
          fi
